name: Contact Request CI

on:
  push:
    branches: [dev, main, feature/contact-request-management]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, EF safety, frontend and Docker
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ChangeThisPassword!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'ChangeThisPassword!2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      REQUIRE_CONTACT_SQLSERVER_TESTS: "true"
      CONTACT_TEST_SQLSERVER_CONNECTION_STRING: Server=localhost,1433;Initial Catalog=ContactRequestIntegration_CI;User ID=sa;Password=ChangeThisPassword!2026;TrustServerCertificate=True;Encrypt=False
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore dotnet tools and solution
        run: |
          dotnet tool restore
          dotnet restore CloudServiceStore.sln
      - name: Build Release
        run: dotnet build CloudServiceStore.sln --configuration Release --no-restore
      - name: Run unit and integration tests
        run: dotnet test CloudServiceStore.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Verify EF model has no pending migration changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/CloudServiceStore.Infrastructure \
            --startup-project src/CloudServiceStore.WebApi
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend for production
        env:
          NODE_ENV: production
        run: npm run build
        working-directory: frontend
      - name: Install temporary Playwright runner and Chromium
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Run Contact public E2E
        working-directory: frontend
        run: npx playwright test e2e/contact-public.spec.ts --config=playwright.ci.config.mjs --reporter=list
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: contact-playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
      - name: Build API Docker image
        run: docker build --file deploy/api.Dockerfile --tag cloud-service-store-api:ci .
