# Keep the original Compose project name so the existing SQL Server volume
# remains attached after the workspace folder was renamed.
name: website_cloud

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cloud-service-store-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -d master
          -Q "IF DB_ID(N'CloudServiceStore') IS NULL OR DATABASEPROPERTYEX(N'CloudServiceStore', N'STATUS') = N'ONLINE'
          SELECT 1 ELSE RAISERROR('CloudServiceStore is not online', 16, 1)" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: cloud-service-store-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CloudServiceStore: Server=sqlserver,1433;Database=CloudServiceStore;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      NewsData__ApiKey: ${NEWSDATA_API_KEY}
      Jwt__Issuer: CloudServiceStore.Api
      Jwt__Audience: CloudServiceStore.Frontend
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      ContactEmail__Enabled: ${CONTACT_EMAIL__ENABLED:-false}
      ContactEmail__Host: ${CONTACT_EMAIL__HOST:-smtp.gmail.com}
      ContactEmail__Port: ${CONTACT_EMAIL__PORT:-587}
      ContactEmail__UseSsl: ${CONTACT_EMAIL__USE_SSL:-true}
      ContactEmail__Username: ${CONTACT_EMAIL__USERNAME:-}
      ContactEmail__Password: ${CONTACT_EMAIL__PASSWORD:-}
      ContactEmail__FromAddress: ${CONTACT_EMAIL__FROM_ADDRESS:-}
      ContactEmail__FromDisplayName: ${CONTACT_EMAIL__FROM_DISPLAY_NAME:-CloudServiceStore}
      ContactEmail__AdminRecipientAddress: ${CONTACT_EMAIL__ADMIN_RECIPIENT_ADDRESS:-}
      ContactEmail__TimeoutSeconds: ${CONTACT_EMAIL__TIMEOUT_SECONDS:-10}
      ContactTurnstile__Enabled: ${CONTACT_TURNSTILE__ENABLED:-false}
      ContactTurnstile__SecretKey: ${CONTACT_TURNSTILE__SECRET_KEY:-}
      ContactTurnstile__ExpectedAction: ${CONTACT_TURNSTILE__EXPECTED_ACTION:-contact_submit}
      ContactTurnstile__ExpectedHostname: ${CONTACT_TURNSTILE__EXPECTED_HOSTNAME:-}
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  migrator:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: migrator
    environment:
      ConnectionStrings__CloudServiceStore: Server=sqlserver,1433;Database=CloudServiceStore;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
    command: ["database", "update", "--project", "src/CloudServiceStore.Infrastructure", "--startup-project", "src/CloudServiceStore.WebApi"]
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
