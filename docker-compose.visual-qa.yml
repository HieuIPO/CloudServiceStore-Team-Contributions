name: cloud_service_store_visual_qa

services:
  visual-qa-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cloud-service-store-visual-qa-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - visual-qa-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  visual-qa-migrator:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: migrator
    container_name: cloud-service-store-visual-qa-migrator
    environment:
      ConnectionStrings__CloudServiceStore: Server=visual-qa-sqlserver,1433;Database=CloudServiceStoreVisualQa;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
    command: ["database", "update", "--project", "src/CloudServiceStore.Infrastructure", "--startup-project", "src/CloudServiceStore.WebApi"]
    depends_on:
      visual-qa-sqlserver:
        condition: service_healthy

  visual-qa-api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: cloud-service-store-visual-qa-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CloudServiceStore: Server=visual-qa-sqlserver,1433;Database=CloudServiceStoreVisualQa;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Seed__VisualQaData: "true"
      # The audit opens every route at six viewports in one session. Keep the
      # QA harness from turning its own refresh traffic into false failures.
      RateLimiting__LoginPermitLimit: "100"
      RateLimiting__RefreshPermitLimit: "1000"
      Jwt__Issuer: CloudServiceStore.VisualQa.Api
      Jwt__Audience: CloudServiceStore.VisualQa.Frontend
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: http://localhost:3002
      Cors__AllowedOrigins__1: http://127.0.0.1:3002
      Frontend__PublicBaseUrl: http://localhost:3002
    ports:
      - "8081:8080"
    depends_on:
      visual-qa-migrator:
        condition: service_completed_successfully

  visual-qa-frontend:
    image: node:24-alpine
    container_name: cloud-service-store-visual-qa-frontend
    working_dir: /app
    environment:
      API_BASE_URL: http://visual-qa-api:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
      NEXT_PUBLIC_SITE_URL: http://localhost:3002
    volumes:
      - ./frontend:/app
      - visual-qa-node-modules:/app/node_modules
      - visual-qa-next-cache:/app/.next
    command: ["sh", "-c", "npm install --no-package-lock && npm run dev -- --hostname 0.0.0.0 --port 3002"]
    ports:
      - "3002:3002"
    depends_on:
      visual-qa-api:
        condition: service_started

volumes:
  visual-qa-mssql-data:
    name: cloud-service-store-visual-qa-mssql-data
  visual-qa-node-modules:
    name: cloud-service-store-visual-qa-node-modules
  visual-qa-next-cache:
    name: cloud-service-store-visual-qa-next-cache
