    <rect x="190" y="0" width="150" height="105" rx="22" fill="#fff" fill-opacity=".8" stroke="#fff" stroke-width="4"/>
    <rect x="380" y="55" width="150" height="105" rx="22" fill="#fff" fill-opacity=".75" stroke="#fff" stroke-width="4"/>
    <path d="M150 105h40M340 55h40" stroke="#0e7490" stroke-width="7" stroke-linecap="round"/>
    <g fill="#14b8a6"><circle cx="48" cy="98" r="10"/><circle cx="238" cy="43" r="10"/><circle cx="428" cy="98" r="10"/></g>
    <g fill="#2563eb" opacity=".6"><rect x="35" y="130" width="80" height="10" rx="5"/><rect x="225" y="75" width="80" height="10" rx="5"/><rect x="415" y="130" width="80" height="10" rx="5"/></g>
