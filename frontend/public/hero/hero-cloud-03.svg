<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cloud storage and security</title>
  <desc id="desc">Secure cloud storage with a shield and connected data blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fdff"/><stop offset=".52" stop-color="#d7f4ff"/><stop offset="1" stop-color="#b6e6e5"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1230" cy="180" r="220" fill="#fff" opacity=".55" filter="url(#blur)"/>
  <circle cx="1450" cy="750" r="260" fill="#22c55e" opacity=".15" filter="url(#blur)"/>
  <g transform="translate(1040 100)">
